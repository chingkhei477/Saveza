<!DOCTYPE html>
<html lang="en-IN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Saveza — Rewards for the way you spend</title>
<meta name="description" content="Saveza is a consumer rewards platform that helps people in India discover cashback and offers on eligible purchases and payments, and track the rewards they qualify for.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230F6E5C'/%3E%3Cpath d='M43 21c-2.5-4.5-8.6-5.6-13-3.3-4.6 2.4-5.2 8.3-.6 10.7 3.6 1.9 9.4 1.6 12.9 3.6 4.6 2.6 4.2 8.6-.5 11-4.6 2.4-11 1-13.4-3.6' fill='none' stroke='%23F2A63B' stroke-width='5.5' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#08312B; --ink-2:#0E453C;
  --brand:#0F6E5C; --brand-600:#0B584A; --brand-tint:#E8F3F0;
  --gold:#F2A63B; --gold-tint:#FDF2E0; --coral:#FF6B5B;
  --paper:#F6F8F7; --white:#fff;
  --text:#0B211E; --muted:#5A716C; --line:#E3EAE7;
  --ok:#12805F; --warn:#B4690E; --stop:#B3261E;
  --r-card:18px; --r-lg:26px; --r-sm:10px;
  --shadow-1:0 1px 2px rgba(8,49,43,.06), 0 4px 14px rgba(8,49,43,.05);
  --shadow-2:0 10px 34px rgba(8,49,43,.11);
  --wrap:1160px;
  --sans:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --display:'Bricolage Grotesque','Inter',system-ui,sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--text);font-family:var(--sans);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
img,svg{max-width:100%}
a{color:inherit}
h1,h2,h3,h4{font-family:var(--display);font-weight:800;letter-spacing:-.025em;line-height:1.08;margin:0}
h1{font-size:clamp(2.3rem,5.4vw,3.9rem)}
h2{font-size:clamp(1.7rem,3.4vw,2.6rem)}
h3{font-size:1.15rem;letter-spacing:-.015em;line-height:1.3}
p{margin:0}
.wrap{max-width:var(--wrap);margin:0 auto;padding:0 22px}
.section{padding:76px 0}
.section-tight{padding:52px 0}
.lede{font-size:1.06rem;color:var(--muted);max-width:62ch}
.stack{display:flex;flex-direction:column;gap:14px}
.rule{height:1px;background:var(--line);border:0;margin:0}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:6px}
.skip{position:absolute;left:-9999px}
.skip:focus{left:16px;top:12px;z-index:99;background:#fff;padding:10px 16px;border-radius:8px}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;font-family:var(--sans);font-weight:600;font-size:.95rem;border-radius:999px;padding:13px 24px;border:1.5px solid transparent;cursor:pointer;text-decoration:none;transition:background .16s,border-color .16s,color .16s}
.btn-primary{background:var(--brand);color:#fff}
.btn-primary:hover{background:var(--brand-600)}
.btn-ghost{background:#fff;border-color:var(--line);color:var(--ink)}
.btn-ghost:hover{border-color:var(--brand);color:var(--brand)}
.btn-quiet{background:transparent;color:var(--brand);padding:10px 4px;font-weight:600}
.btn-gold{background:var(--gold);color:#3B2606}
.btn-gold:hover{background:#E39724}
.btn-sm{padding:9px 16px;font-size:.86rem}
.btn-block{width:100%}
.linky{color:var(--brand);font-weight:600;text-decoration:none;border-bottom:1.5px solid rgba(15,110,92,.28);padding-bottom:1px}
.linky:hover{border-bottom-color:var(--brand)}

/* ---------- chips / badges ---------- */
.chip{display:inline-flex;align-items:center;gap:6px;font-size:.76rem;font-weight:600;padding:5px 10px;border-radius:var(--r-sm);background:var(--brand-tint);color:var(--brand-600)}
.chip-sample{background:#F1EFFA;color:#5B4BAA}
.chip-gold{background:var(--gold-tint);color:var(--warn)}
.chip-line{background:#fff;border:1px solid var(--line);color:var(--muted);font-weight:500}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}

/* ---------- header ---------- */
.hdr{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hdr-in{display:flex;align-items:center;gap:26px;height:70px}
.brandlink{display:flex;align-items:center;gap:10px;text-decoration:none;flex:none}
.nav{display:flex;gap:4px;margin-left:6px}
.nav a{text-decoration:none;font-size:.93rem;font-weight:500;color:var(--muted);padding:8px 12px;border-radius:9px}
.nav a:hover{color:var(--ink);background:var(--brand-tint)}
.nav a.on{color:var(--brand-600);background:var(--brand-tint);font-weight:600}
.hdr-act{margin-left:auto;display:flex;gap:10px;align-items:center}
.burger{display:none;margin-left:auto;background:#fff;border:1.5px solid var(--line);border-radius:11px;width:44px;height:44px;align-items:center;justify-content:center;cursor:pointer}
.mnav{display:none;border-bottom:1px solid var(--line);background:#fff;padding:10px 0 20px}
.mnav.open{display:block}
.mnav a{display:block;text-decoration:none;padding:12px 4px;font-weight:500;border-bottom:1px solid var(--line);color:var(--ink)}
.mnav .mact{display:flex;gap:10px;margin-top:16px}

/* ---------- hero ---------- */
.hero{background:linear-gradient(174deg,#EFF6F3 0%,#FBFCFB 62%,var(--paper) 100%);border-bottom:1px solid var(--line);overflow:hidden}
.hero-grid{display:grid;grid-template-columns:1.04fr .96fr;gap:52px;align-items:center;padding:64px 0 70px}
.hero h1{max-width:14ch}
.hero .lede{margin-top:20px;font-size:1.14rem;color:#3F5A55}
.hero-cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:30px}
.hero-fine{margin-top:16px;font-size:.86rem;color:var(--muted)}
.hero-art{position:relative}

/* ---------- generic cards ---------- */
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r-card);box-shadow:var(--shadow-1)}
.pad{padding:22px}
.grid{display:grid;gap:18px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:26px;flex-wrap:wrap}
.head p{margin-top:10px}

/* ---------- trust ---------- */
.trust{display:grid;grid-template-columns:repeat(4,1fr);gap:0;background:#fff;border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.trust-i{padding:26px 24px;border-right:1px solid var(--line)}
.trust-i:last-child{border-right:0}
.trust-i h3{margin:14px 0 7px}
.trust-i p{font-size:.92rem;color:var(--muted)}
.tico{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;background:var(--brand-tint);color:var(--brand)}

/* ---------- offer coupon card ---------- */
.offer{position:relative;background:#fff;border:1px solid var(--line);border-radius:var(--r-card);box-shadow:var(--shadow-1);display:flex;flex-direction:column;transition:box-shadow .18s,border-color .18s}
.offer:hover{box-shadow:var(--shadow-2);border-color:#CFDDD8}
.offer-top{padding:18px 20px 20px}
.offer-strip{height:76px;border-radius:14px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;margin-bottom:15px;color:#fff}
.offer-strip .amt{font-family:var(--display);font-weight:800;font-size:1.75rem;letter-spacing:-.03em}
.offer-strip .amt span{font-size:1.05rem;font-weight:700;opacity:.9}
.offer h3{font-size:1.02rem;margin-bottom:6px}
.offer-mer{font-size:.85rem;color:var(--muted);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.perf{position:relative;height:1px;margin:0 14px;border-top:1.5px dashed #D6E2DE}
.perf::before,.perf::after{content:"";position:absolute;top:-9px;width:18px;height:18px;border-radius:50%;background:var(--paper);border:1px solid var(--line)}
.perf::before{left:-23px;clip-path:inset(0 0 0 50%)}
.perf::after{right:-23px;clip-path:inset(0 50% 0 0)}
.offer-bot{padding:16px 20px 18px}
.kv{display:flex;justify-content:space-between;gap:14px;font-size:.85rem;padding:5px 0}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:600;font-variant-numeric:tabular-nums;text-align:right}
.offer-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px}
.expiry{font-size:.8rem;color:var(--muted)}
.expiry.soon{color:var(--warn);font-weight:600}
.offers-page{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}

/* ---------- filters ---------- */
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:24px}
.field{background:#fff;border:1.5px solid var(--line);border-radius:11px;padding:11px 14px;font:inherit;font-size:.92rem;color:var(--text);min-width:0}
.field:focus{border-color:var(--brand);outline:none}
.search{flex:1;min-width:220px}
.pills{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:22px}
.pill{flex:none;background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:8px 15px;font-size:.87rem;font-weight:500;cursor:pointer;color:var(--muted);white-space:nowrap}
.pill.on{background:var(--ink);border-color:var(--ink);color:#fff}

/* ---------- categories ---------- */
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.cat{background:#fff;border:1px solid var(--line);border-radius:var(--r-card);padding:20px;text-decoration:none;display:block;transition:transform .16s,box-shadow .16s}
.cat:hover{transform:translateY(-2px);box-shadow:var(--shadow-2)}
.cat-ico{width:46px;height:46px;border-radius:13px;display:flex;align-items:center;justify-content:center;margin-bottom:14px}
.cat h3{font-size:1rem}
.cat p{font-size:.85rem;color:var(--muted);margin-top:5px}
.cat .count{font-size:.8rem;font-weight:600;color:var(--brand);margin-top:12px;display:block}

/* ---------- steps ---------- */
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;counter-reset:s}
.step{position:relative;padding-top:52px}
.step::before{counter-increment:s;content:counter(s);position:absolute;top:0;left:0;width:40px;height:40px;border-radius:50%;background:var(--ink);color:var(--gold);font-family:var(--display);font-weight:700;font-size:1.05rem;display:flex;align-items:center;justify-content:center}
.step h3{margin-bottom:8px}
.step p{font-size:.93rem;color:var(--muted)}

/* ---------- calculator ---------- */
.calc{display:grid;grid-template-columns:1fr 1fr;gap:0;background:#fff;border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.calc-in{padding:30px}
.calc-out{padding:30px;background:linear-gradient(160deg,var(--ink) 0%,#0B4A3F 100%);color:#DCEBE7}
.lbl{display:block;font-size:.87rem;font-weight:600;color:var(--muted);margin-bottom:7px}
.calc-in .field{width:100%}
.range{width:100%;accent-color:var(--brand);margin-top:14px}
.bigrup{font-family:var(--display);font-weight:800;font-size:3.1rem;letter-spacing:-.04em;color:#fff;line-height:1}
.bigrup span{color:var(--gold);font-size:1.7rem;vertical-align:.28em;margin-right:2px}
.calc-line{display:flex;justify-content:space-between;font-size:.9rem;padding:8px 0;border-bottom:1px dashed rgba(255,255,255,.16)}
.calc-line b{font-variant-numeric:tabular-nums;color:#fff;font-weight:600}
.calc-note{font-size:.84rem;margin-top:16px;color:#9FC2BB}
.badge-fail{background:rgba(255,107,91,.16);color:#FFC2BA;border-radius:9px;padding:10px 12px;font-size:.87rem;margin-top:14px}

/* ---------- tables ---------- */
.tbl{width:100%;border-collapse:collapse;font-size:.9rem}
.tbl th{text-align:left;font-weight:600;color:var(--muted);font-size:.83rem;padding:12px 14px;border-bottom:1px solid var(--line)}
.tbl td{padding:14px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.num{font-variant-numeric:tabular-nums;text-align:right}
.st{display:inline-flex;align-items:center;gap:7px;font-size:.82rem;font-weight:600}
.st-pending{color:var(--warn)} .st-confirmed{color:var(--brand)} .st-credited{color:var(--ok)} .st-rejected{color:var(--stop)}

/* ---------- faq ---------- */
.faq{background:#fff;border:1px solid var(--line);border-radius:var(--r-card);overflow:hidden}
.faq details{border-bottom:1px solid var(--line)}
.faq details:last-child{border-bottom:0}
.faq summary{padding:18px 22px;cursor:pointer;font-weight:600;font-size:.98rem;list-style:none;display:flex;justify-content:space-between;gap:16px;align-items:center}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";font-size:1.4rem;color:var(--brand);font-weight:400;line-height:1}
.faq details[open] summary::after{content:"−"}
.faq .ans{padding:0 22px 20px;color:var(--muted);font-size:.94rem;max-width:74ch}

/* ---------- prose ---------- */
.prose{max-width:70ch}
.prose h2{margin:38px 0 14px}
.prose h3{margin:26px 0 8px}
.prose p,.prose li{color:#38504B;font-size:1rem}
.prose p{margin-bottom:14px}
.prose ul{padding-left:20px;margin:0 0 16px}
.prose li{margin-bottom:8px}

/* ---------- business info ---------- */
.bizgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:0 30px}
.bizrow{display:flex;justify-content:space-between;gap:16px;padding:11px 0;border-bottom:1px dashed var(--line);font-size:.9rem}
.bizrow dt{color:var(--muted);flex:none}
.bizrow dd{margin:0;text-align:right;font-weight:500}
.ph{background:#FFF4E5;border:1px dashed #E2B366;color:#8A5A08;border-radius:6px;padding:1px 7px;font-size:.82rem;font-weight:600}

/* ---------- footer ---------- */
.ftr{background:var(--ink);color:#B9D2CD;padding:60px 0 30px;margin-top:20px}
.ftr h4{font-family:var(--sans);font-size:.88rem;font-weight:600;color:#fff;margin:0 0 14px}
.ftr a{color:#B9D2CD;text-decoration:none;font-size:.9rem;display:block;padding:5px 0}
.ftr a:hover{color:#fff}
.ftr-grid{display:grid;grid-template-columns:1.5fr 1fr 1fr 1fr;gap:32px}
.ftr-legal{margin-top:30px;padding-top:22px;border-top:1px solid rgba(255,255,255,.1);font-size:.82rem;color:#8FB6AE;display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}
.disc{font-size:.82rem;color:#8FB6AE;max-width:78ch;margin-top:14px;line-height:1.65}

/* ---------- modal / drawer ---------- */
.scrim{position:fixed;inset:0;background:rgba(6,32,28,.5);z-index:60;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:#fff;border-radius:var(--r-lg);max-width:430px;width:100%;padding:30px;box-shadow:var(--shadow-2);max-height:90vh;overflow:auto}
.drawer{background:#fff;border-radius:var(--r-lg);max-width:560px;width:100%;max-height:88vh;overflow:auto;box-shadow:var(--shadow-2)}
.x{background:#fff;border:1px solid var(--line);width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:1.1rem;line-height:1;color:var(--muted)}
.mrow{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:18px}
.callout{background:var(--brand-tint);border-radius:12px;padding:14px 16px;font-size:.88rem;color:var(--ink-2);margin-top:16px}

/* ---------- misc ---------- */
.hero-anim{opacity:0;transform:translateY(8px) scale(.97);animation:pop .55s cubic-bezier(.2,.8,.3,1) .5s forwards}
@keyframes pop{to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.hero-anim{opacity:1;transform:none}}

@media (max-width:980px){
  .hero-grid{grid-template-columns:1fr;gap:34px;padding:46px 0 54px}
  .hero-art{max-width:420px}
  .nav,.hdr-act{display:none}
  .burger{display:flex}
  .trust,.g4,.cats,.steps,.offers-page,.g3{grid-template-columns:repeat(2,1fr)}
  .trust-i{border-right:0;border-bottom:1px solid var(--line)}
  .trust-i:nth-child(2n){border-right:0}
  .trust-i:nth-child(odd){border-right:1px solid var(--line)}
  .calc,.ftr-grid{grid-template-columns:1fr}
  .section{padding:56px 0}
}
@media (max-width:640px){
  .g2,.g3,.g4,.cats,.steps,.offers-page,.trust,.bizgrid{grid-template-columns:1fr}
  .trust-i:nth-child(odd){border-right:0}
  .ftr-legal{flex-direction:column;gap:8px}
  .section{padding:44px 0}
}
</style>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header class="hdr">
  <div class="wrap hdr-in">
    <a class="brandlink" href="#/" aria-label="Saveza home"><span id="logo-slot"></span></a>
    <nav class="nav" id="nav" aria-label="Main"></nav>
    <div class="hdr-act">
      <button class="btn btn-ghost btn-sm" data-auth="login">Log in</button>
      <button class="btn btn-primary btn-sm" data-auth="join">Join Saveza</button>
    </div>
    <button class="burger" id="burger" aria-label="Open menu" aria-expanded="false">
      <svg width="20" height="14" viewBox="0 0 20 14" fill="none" stroke="#08312B" stroke-width="2" stroke-linecap="round"><path d="M1 1h18M1 7h18M1 13h18"/></svg>
    </button>
  </div>
  <div class="mnav" id="mnav"><div class="wrap"></div></div>
</header>
<main id="main"></main>
<footer class="ftr" id="ftr"></footer>
<div id="overlay"></div>
<script>
/* ============================================================
   SAVEZA — front-end reference build
   Everything below runs client-side. There is no backend, no
   auth, no payment integration and no real reward ledger.
   Sample offers are flagged with sample:true and must be
   replaced by real records from the offers database.
   ============================================================ */

/* ---------- 1. ADMIN CONFIG -------------------------------
   Replace EVERY value that begins with "[REPLACE" before this
   site goes to production. The banner at the top of the page
   stays visible until all of them are replaced.
   Delete keys that genuinely do not apply (e.g. gstin if the
   business is not GST-registered) rather than inventing one. */
const SITE_CONFIG = {
  legalBusinessName: "[REPLACE: REGISTERED LEGAL BUSINESS NAME]",
  brand:             "Saveza",
  entityType:        "[REPLACE: PRIVATE LIMITED / LLP / PROPRIETORSHIP]",
  addressLine1:      "[REPLACE: REGISTERED ADDRESS LINE 1]",
  addressLine2:      "[REPLACE: REGISTERED ADDRESS LINE 2]",
  city:              "[REPLACE: CITY]",
  state:             "[REPLACE: STATE]",
  pincode:           "[REPLACE: PIN CODE]",
  country:           "India",
  supportEmail:      "support@saveza.in",
  supportPhone:      "[REPLACE: SUPPORT PHONE]",
  supportHours:      "[REPLACE: SUPPORT HOURS]",
  grievanceOfficer:  "[REPLACE: GRIEVANCE OFFICER NAME]",
  grievanceEmail:    "[REPLACE: GRIEVANCE EMAIL]",
  businessReg:       "[REPLACE: CIN / LLPIN / UDYAM NUMBER — OR DELETE]",
  gstin:             "[REPLACE: GSTIN — OR DELETE IF NOT REGISTERED]",
  lastUpdated:       "[REPLACE: POLICY LAST-UPDATED DATE]"
};
const isPh = v => typeof v === "string" && v.startsWith("[REPLACE");
const cfg = k => { const v = SITE_CONFIG[k]; return isPh(v) ? `<span class="ph">${v}</span>` : v; };
const cfgText = k => SITE_CONFIG[k];
const unresolved = () => Object.entries(SITE_CONFIG).filter(([,v]) => isPh(v)).map(([k]) => k);

/* ---------- 2. CATEGORIES ---------- */
const I = {
  bag:'<path d="M4 8h16l-1.2 12.5a1.5 1.5 0 0 1-1.5 1.4H6.7a1.5 1.5 0 0 1-1.5-1.4L4 8Z"/><path d="M8.5 10.5V6.8a3.5 3.5 0 0 1 7 0v3.7"/>',
  food:'<path d="M6 3v8a3 3 0 0 0 6 0V3"/><path d="M9 11v10"/><path d="M18 3c-1.7 1.2-2.5 3.2-2.5 5.5S16.3 13 18 14v7"/>',
  cart:'<path d="M4 5h2.2l2.3 10.6a1.6 1.6 0 0 0 1.6 1.3h7.4a1.6 1.6 0 0 0 1.6-1.2L20.6 8H7"/><circle cx="10" cy="20.4" r="1.3"/><circle cx="17.6" cy="20.4" r="1.3"/>',
  plane:'<path d="M10.6 3.6a1.6 1.6 0 0 1 2.8 0L15.7 9l5.1 1.6a1.2 1.2 0 0 1 .2 2.2l-4.6 2.4-.5 5.3a1 1 0 0 1-1.8.5L12 17.4l-2.1 3.6a1 1 0 0 1-1.8-.5l-.5-5.3L3 12.8a1.2 1.2 0 0 1 .2-2.2L8.3 9Z"/>',

VIEWS.cashback = () => `<section class="section"><div class="wrap">
  <div style="max-width:70ch"><h1 style="font-size:2.4rem">How cashback works</h1>
  <p class="lede" style="margin-top:14px">Cashback is a reward associated with eligible transactions under a specific offer. Each offer can set its own eligibility requirements, minimum purchase amount, maximum reward and verification timeline.</p></div>
  <div style="margin-top:40px">${calculator()}</div>
  <div class="grid g3" style="margin-top:20px">
    <div class="card pad"><h3>The rate</h3><p style="color:var(--muted);font-size:.93rem;margin-top:8px">Either a percentage of the eligible transaction value, or a flat amount. The offer states which.</p></div>
    <div class="card pad"><h3>The cap</h3><p style="color:var(--muted);font-size:.93rem;margin-top:8px">The most that offer will ever pay on one transaction, however large the purchase.</p></div>
    <div class="card pad"><h3>The eligible value</h3><p style="color:var(--muted);font-size:.93rem;margin-top:8px">Usually the item total. Delivery, taxes and separately funded discounts are commonly excluded — check the offer.</p></div>
  </div>
  <div class="prose" style="margin-top:48px">
    <h2>A worked example</h2>
    <p>Take an offer paying 5% cashback, capped at ₹100, with a minimum spend of ₹999.</p>
    <ul>
      <li>You spend ₹2,000. Five percent of that is ₹100, which equals the cap, so the reward is ₹100.</li>
      <li>You spend ₹4,000. Five percent is ₹200, but the cap holds the reward at ₹100.</li>
      <li>You spend ₹800. That is below the ₹999 minimum, so no reward applies.</li>
    </ul>
    <p>This is an illustration of the arithmetic, not a live offer.</p>
    <h2>Why a reward can take time</h2>
    <p>A merchant confirms a transaction to Saveza only after their own checks. Where an order can still be returned or a booking cancelled, the reward is held until that window closes. The crediting timeline printed on each offer reflects this, and it is the timeline Saveza is held to.</p>
    <h2>If a reward does not appear</h2>
    <p>Wait for the stated timeline to pass, then raise it from your account with the transaction details. Support will check the transaction against the offer terms and tell you which term decided the outcome.</p>
  </div>
</div></section>`;

VIEWS.about = () => `<section class="section"><div class="wrap">
  <div class="prose">
    <h1 style="font-size:2.4rem">About Saveza</h1>
    <p class="lede" style="margin:16px 0 30px">Saveza is a consumer rewards platform designed to help people discover relevant offers and savings opportunities while shopping and making eligible payments.</p>
    <h2>What Saveza does</h2>
    <p>Saveza collects offers in one place, states their terms in plain language, and tracks whether a transaction qualified for a reward. It is a discovery and tracking layer. It does not take custody of money, process payments, or replace the app you pay with.</p>
    <h2>Who it is for</h2>
    <p>People in India who already shop and pay online and would rather know in advance whether an offer applies, what it caps out at, and when the money actually arrives.</p>
    <h2>How offers are created</h2>
    <p>An offer is published only when its terms are complete: reward rate, maximum reward, minimum spend, eligible payment methods, validity dates and crediting timeline. An offer with a missing field cannot be published, because the user-facing page would then be incomplete.</p>
    <h2>How cashback is calculated</h2>
    <p>The reward is the lower of the rate applied to the eligible transaction value and the offer's cap, provided the transaction is at or above the minimum spend. The eligible value excludes anything the offer excludes — commonly delivery, taxes and separately funded discounts.</p>
    <h2>How rewards are tracked</h2>
    <p>Each tracked transaction moves through pending, then either confirmed and credited, or not eligible with a stated reason. The status and the reason are visible from the account for the life of the record.</p>
    <h2>How support works</h2>
    <p>Support is the first line for a missing or disputed reward and reviews the transaction against the offer terms. Unresolved issues escalate to the grievance officer named below.</p>
    <h2>What Saveza is not</h2>
    <p>Saveza is not a bank, a lender, an investment product, a wallet or a UPI application, and it does not offer any income or return. Rewards depend entirely on offer eligibility.</p>
  </div>
</div></section>`;

/* ---------- 10. OVERLAYS ---------- */
const ov = document.getElementById("overlay");
function closeOverlay(){ ov.innerHTML = ""; document.body.style.overflow = ""; }
function openOverlay(html){
  ov.innerHTML = `<div class="scrim" data-scrim>${html}</div>`;
  document.body.style.overflow = "hidden";
  const f = ov.querySelector("button,input,select,a");
  if(f) f.focus();
}
ov.addEventListener("click", e => {
  if(e.target.matches("[data-scrim]") || e.target.closest("[data-close]")) closeOverlay();
});
document.addEventListener("keydown", e => { if(e.key === "Escape") closeOverlay(); });

function authModal(mode){
  const join = mode === "join";
  openOverlay(`<div class="modal" role="dialog" aria-modal="true" aria-label="${join?"Join Saveza":"Log in"}">
    <div class="mrow"><h2 style="font-size:1.5rem">${join?"Join Saveza":"Log in"}</h2><button class="x" data-close aria-label="Close">×</button></div>
    <label class="lbl" for="a-phone">Mobile number</label>
    <input class="field" id="a-phone" style="width:100%" inputmode="numeric" placeholder="10-digit mobile number">
    ${join?`<label class="lbl" for="a-ref" style="margin-top:16px">Referral code (optional)</label>
    <input class="field" id="a-ref" style="width:100%" placeholder="Enter a code if you have one">`:""}
    <button class="btn btn-primary btn-block" style="margin-top:20px" id="a-go">Send verification code</button>
    <div class="callout">This build has no backend. Nothing is sent, stored or verified — wire this form to the real authentication service before launch.</div>
    ${join?`<p style="font-size:.82rem;color:var(--muted);margin-top:14px">Joining means accepting the <a class="linky" href="#/terms" data-close>terms of use</a> and the <a class="linky" href="#/privacy" data-close>privacy policy</a>.</p>`:""}
  </div>`);
  const go = document.getElementById("a-go");
  go.onclick = () => { go.textContent = "Not connected in this build"; go.disabled = true; go.style.opacity = ".65"; };
}

document.addEventListener("click", e => {
  const a = e.target.closest("[data-auth]");
  if(a){ authModal(a.dataset.auth); return; }
  const o = e.target.closest("[data-offer]");
  if(o){ openOverlay(offerDrawer(OFFERS.find(x => x.id === o.dataset.offer))); }
});

/* ---------- 11. PAGE BEHAVIOUR ---------- */
function wireCalculator(){
  const sel = document.getElementById("c-offer");
  if(!sel) return;
  const amt = document.getElementById("c-amt"), rng = document.getElementById("c-range"), out = document.getElementById("calc-out");
  const draw = () => {
    const o = OFFERS.find(x => x.id === sel.value);
    const v = Math.max(0, Number(amt.value) || 0);
    const r = computeReward(o, v);
    const uncapped = o.type === "percent" ? v * o.rate / 100 : o.rate;
    out.innerHTML = `
      <div style="font-size:.85rem;color:#9FC2BB;margin-bottom:8px">${v < o.min ? "No reward on this amount" : "Reward on this purchase"}</div>
      <div class="bigrup"><span>₹</span>${new Intl.NumberFormat("en-IN").format(Math.round(r))}</div>
      ${v < o.min ? `<div class="badge-fail">This offer needs a minimum spend of ${inr(o.min)}. You are ${inr(o.min - v)} short.</div>` : ""}
      <div style="margin-top:22px">
        <div class="calc-line"><span>Purchase amount</span><b>${inr(v)}</b></div>
        <div class="calc-line"><span>Offer rate</span><b>${rewardLabel(o)}</b></div>
        <div class="calc-line"><span>${o.type === "percent" ? "Rate applied to purchase" : "Flat reward"}</span><b>${inr(uncapped)}</b></div>
        <div class="calc-line"><span>Maximum reward on this offer</span><b>${inr(o.cap)}</b></div>
        <div class="calc-line" style="border-bottom:0"><span>Credited</span><b style="font-weight:500;font-size:.84rem;text-align:right;max-width:60%">${esc(o.credit)}</b></div>
      </div>
      <p class="calc-note">${uncapped > o.cap && v >= o.min ? `The cap applies here — ${rewardLabel(o)} of ${inr(v)} would be ${inr(uncapped)}, so the reward stops at ${inr(o.cap)}.` : "The reward is the lower of the rate applied to your spend and the offer's cap."} This is an illustration using sample offer data.</p>`;
  };
  sel.onchange = draw;
  amt.oninput = () => { rng.value = Math.min(Number(amt.value) || 0, rng.max); draw(); };
  rng.oninput = () => { amt.value = rng.value; draw(); };
  draw();
}

function wireOffers(q){
  const box = document.getElementById("results");
  if(!box) return;
  let cat = q.cat || "all";
  const search = document.getElementById("q"), sort = document.getElementById("sort");
  const paint = () => {
    const term = (search.value || "").trim().toLowerCase();
    let list = activeOffers()
      .filter(o => cat === "all" || o.cat === cat)
      .filter(o => !term || (o.title + " " + o.merchant + " " + catBy(o.cat).n).toLowerCase().includes(term));
    const s = sort.value;
    list.sort((a, b) => s === "cap" ? b.cap - a.cap : s === "min" ? a.min - b.min : daysLeft(a.expiry) - daysLeft(b.expiry));
    box.innerHTML = list.map(offerCard).join("");
    document.getElementById("empty").style.display = list.length ? "none" : "block";
  };
  search.oninput = paint;
  sort.onchange = paint;
  document.getElementById("pills").onclick = e => {
    const p = e.target.closest("[data-cat]");
    if(!p) return;
    cat = p.dataset.cat;
    document.querySelectorAll("#pills .pill").forEach(el => el.classList.toggle("on", el === p));
    history.replaceState(null, "", cat === "all" ? "#/offers" : `#/offers?cat=${cat}`);
    paint();
  };
  paint();
}

/* ---------- 12. ROUTER ---------- */
function parseHash(){
  const raw = (location.hash || "#/").slice(1);
  const [path, qs] = raw.split("?");
  const q = {};
  new URLSearchParams(qs || "").forEach((v, k) => q[k] = v);
  const key = (path.replace(/^\/|\/$/g, "") || "home");
  return { key, q };
}

function route(){
  const { key, q } = parseHash();
  const view = VIEWS[key] || VIEWS[404];
  document.getElementById("main").innerHTML = view(q);
  document.querySelectorAll("#nav a").forEach(a =>
    a.classList.toggle("on", a.getAttribute("href") === "#/" + (key === "home" ? "" : key)));
  document.getElementById("mnav").classList.remove("open");
  document.getElementById("burger").setAttribute("aria-expanded", "false");
  closeOverlay();
  wireCalculator();
  wireOffers(q);
  const titles = { home:"Rewards for the way you spend", offers:"Offers", categories:"Categories",
    "how-it-works":"How Saveza works", cashback:"How cashback works", refer:"Refer a friend",
    account:"Your rewards", help:"Help and support", about:"About Saveza", terms:"Terms of use", privacy:"Privacy policy" };
  document.title = `Saveza — ${titles[key] || "Page not found"}`;
  window.scrollTo(0, 0);
}

document.getElementById("burger").onclick = e => {
  const m = document.getElementById("mnav"), open = m.classList.toggle("open");
  e.currentTarget.setAttribute("aria-expanded", String(open));
};

window.addEventListener("hashchange", route);
renderChrome();
route();
</script>
</body>
</html>
